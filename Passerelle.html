    exporterEori: ['yes', 'no', 'unknown'], importerEori: ['yes', 'no', 'unknown'],
    transportMode: ['unknown', 'road', 'air', 'sea', 'rail'],

const tr = lang => locales[lang] || locales.fr;
const localeFor = lang => lang==='en'?'en-GB':'fr-FR';
function money(value,currency,lang) {return new Intl.NumberFormat(localeFor(lang),{style:'currency',currency:currency==='GBP'?'GBP':'EUR'}).format(value);}
function date(value,lang) {return new Intl.DateTimeFormat(localeFor(lang),{year:'numeric',month:'long',day:'numeric',...(/^\d{4}-\d{2}-\d{2}$/.test(String(value))?{timeZone:'UTC'}:{})}).format(new Date(value));}
function number(value,lang) {return new Intl.NumberFormat(localeFor(lang),{maximumFractionDigits:6}).format(value);}

return {locales,tr,localeFor,money,date,number};

n class="trust-panel section-width" id="trust"><div class="trust-icon">${icon('shield')}</div><div><h2>${c.trustTitle}</h2><p>${c.trustText}</p></div>${btn(c.trustAction,'limits','secondary')}</section></main>`;}
function selectOptions(field,options){return options.map(value=>{let label=t()[value]||value;if(field==='originCountry'&&value==='other')label=t().originOther;if((field==='dutyMode'||field==='vatMode')&&value==='unknown')label=t().leaveUnknown;return `<option value="${value}" ${state.data[field]===value?'selected':''}>${e(label)}</option>`;}).join('');}
function field(name,{required=false,type='text',help='',options=null,placeholder='',full=false}={}){const c=t();const err=state.errors[name];const id=`field-${name}`;const desc=[help?`${id}-help`:'',err?`${id}-error`:''].filter(Boolean).join(' ');const attrs=`id="${id}" name="${name}" data-field="${name}" ${required?'aria-required="true"':''} ${err?'aria-invalid="true"':''} ${desc?`aria-describedby="${desc}"`:''}`;const value=e(state.data[name]??'');const input=options?`<select ${attrs}>${selectOptions(name,options)}</select>`:type==='textarea'?`<textarea ${attrs} rows="3" maxlength="600" placeholder="${e(placeholder)}">${value}</textarea>`:`<input ${attrs} type="${type==='decimal'?'text':type}" ${type==='decimal'?'inputmode="decimal"':''} ${name==='hsCode'?'inputmode="numeric"':''} value="${value}" maxlength="${name==='description'?600:160}" ${placeholder?`placeholder="${e(placeholder)}"`:''} autocomplete="${name==='company'?'organization':'off'}">`;return `<div class="field ${full?'full':''} ${err?'has-error':''}"><label for="${id}">${c[name]||name}${required?' <span aria-hidden="true">*</span>':` <span class="optional">${c.optional}</span>`}</label>${input}${help?`<p class="field-help" id="${id}-help">${e(help)}</p>`:''}${err?`<p class="field-error" id="${id}-error">${icon('warning')}${e(c.errors[err]||c.errors.required)}</p>`:''}</div>`;}
const opt=(name,extra={})=>field(name,{options:enumOptions[name],...extra});

function tariffPanel(){const c=connectionCopy[state.lang];return `<section class="connection-panel"><h2>${c.tariffTitle}</h2><p>${c.tariffText}</p><label for="tariff-code">${c.code}</label><input id="tariff-code" inputmode="numeric" maxlength="10" value="${e(tariffCode)}"><button type="button" class="btn secondary small" data-action="tariff-lookup" ${tariffBusy?'disabled':''}>${tariffBusy?c.loading:c.lookup}</button><p class="small">${c.privacy}</p>${tariffMessage?`<p role="status">${e(c[tariffMessage]||c.failed)}</p>`:''}${tariffData?`<div class="tariff-reference"><h3>${e(tariffData.code)} · ${e(tariffData.description)}</h3><p>${c.retrieved} ${e(tariffData.retrievedAt)} · ${e(tariffData.adapterVersion)} ${tariffData.cached?c.cached:''}</p><p>${c.note}</p><a href="${e(tariffData.source)}" target="_blank" rel="noopener noreferrer">${c.source} ↗</a><details><summary>${c.type} (${tariffData.measures.length})</summary>${tariffData.measures.length?tariffData.measures.map(m=>`<article><strong>${e(m.type)}</strong><p>${c.area}: ${e(m.area)} (${e(m.areaId)})<br>${c.expression}: ${e(m.expression||'—')}<br>${c.conditions}: ${m.conditions}<br>${c.starts}: ${e(m.starts||'—')} · ${c.ends}: ${e(m.ends||'—')}<br>${c.exclusions}: ${e(m.exclusions.join(', ')||'—')}</p></article>`).join(''):c.empty}</details></div>`:''}</section>`;}
async function lookupTariff(){
 const code=tariffCode.trim();if(!/^\d{10}$/.test(code)){tariffMessage='invalid';render(false);return;}
 if(location.protocol==='file:'){tariffMessage='offline';render(false);return;}
 tariffBusy=true;tariffData=null;tariffMessage='';render(false);
 try{const response=await fetch('/api/tariff?code='+encodeURIComponent(code),{signal:AbortSignal.timeout(22000)});const body=await response.json();if(!response.ok){tariffMessage=body.error==='not_found'?'notFound':body.error==='rate_limited'?'rateLimited':'failed';}else if(body.code===code&&Array.isArray(body.measures)){tariffData=body;}else{tariffMessage='failed';}}
 catch{tariffMessage='failed';}finally{tariffBusy=false;render(false);}
}

}

function costTable(result){const c=t(),d=state.data;return `<div class="cost-lines">${Object.entries(result.lines).map(([key,line])=>`<div class="cost-line"><div><span>${c.lineLabels[key]}</span><small class="kind ${line.kind}">${c.kindLabels[line.kind]}</small>${['duty','vat'].includes(key)&&line.amount!==null?`<small class="formula">${c.formula} : ${money(parseNumber(d[key==='duty'?'customsBase':'vatBase']),d.currency,state.lang)} × ${number(parseNumber(d[key==='duty'?'dutyRate':'vatRate']),state.lang)} % · ${c.toConfirm}</small>`:''}</div><strong class="${line.amount===null?'unknown-amount':''}">${line.amount===null?c.notCalculated:money(line.amount,d.currency,state.lang)}</strong></div>`).join('')}</div><div class="estimate-total"><span>${result.total===null?c.knownSubtotal:c.estimatedTotal}</span><strong>${money(result.total??result.subtotal,d.currency,state.lang)}</strong><p>${result.total===null?c.subtotalDefinition:c.totalDefinition}</p></div><div class="cash-row"><span>${c.cashOutlay}</span><strong>${result.cashOutlay===null?c.notCalculated:money(result.cashOutlay,d.currency,state.lang)}</strong></div><p class="small muted">${result.cashOutlay===null?c.cashUnknown:c.cashDefinition}${result.vatExcluded?` ${c.vatExcluded} ${c.pvaHelp}`:''}</p>`;}

s.duty.amount===null?`<p class="small">${c.dutyUnknownReason}</p>`:''}</div><div><h3>${c.vatHeading}</h3><p>${c.vatHelp}</p><p><strong>${c.vatTreatment} :</strong> ${c[d.vatTreatment]}</p>${d.vatMode==='illustrative'?`<p class="assumption-formula">${c.vatRate}: ${number(parseNumber(d.vatRate)||0,state.lang)} %<br>${c.vatBase}: ${money(parseNumber(d.vatBase)||0,d.currency,state.lang)}<br><span>${c.toConfirm}</span></p>`:''}<p class="small">${c.pvaHelp}</p></div></div>${btn(c.edit,'edit-assumptions','ghost small','edit')}</section>${checklist()}<div class="report-boundary">${icon('shield')}<p>${c.boundary}</p></div><p class="version-line">${c.calculatedOn} ${date(state.calculatedAt,state.lang)} · ${c.configuration} ${RULE_CONFIG.version} / ${RULE_VERSION} · ${c.contentReview} ${date(CONTENT_REVIEWED_AT,state.lang)}</p><div class="results-bottom">${btn(c.download,'download','primary','download')}${btn(c.save,'save','secondary','save')}${btn(c.reset,'reset','ghost','trash')}</div></main>`;}
function contactField(name,{required=false,type='text'}={}){const c=t(),err=state.contactErrors[name],id=`contact-${name}`,label=c['contact'+name.charAt(0).toUpperCase()+name.slice(1)];return `<div class="field ${name==='note'?'full':''}"><label for="${id}">${label}${required?' *':` <span class="optional">${c.optional}</span>`}</label>${name==='language'?`<select id="${id}" data-contact="${name}"><option value="fr" ${state.contact.language==='fr'?'selected':''}>${c.languageFrench}</option><option value="en" ${state.contact.language==='en'?'selected':''}>${c.languageEnglish}</option></select>`:name==='note'?`<textarea id="${id}" data-contact="${name}" maxlength="1000" rows="4">${e(state.contact[name])}</textarea>`:`<input id="${id}" data-contact="${name}" type="${type}" value="${e(state.contact[name])}" maxlength="200" ${required?'aria-required="true"':''} ${err?`aria-invalid="true" aria-describedby="${id}-error"`:''} autocomplete="${name==='name'?'name':name==='email'?'email':'organization'}">`}${err?`<p id="${id}-error" class="field-error">${c.errors[err]}</p>`:''}</div>`;}
function contact(){const c=t();if(state.contactReady)return `<main id="main" class="contact-page section-width"><div class="success-card"><span class="success-icon">${icon('check')}</span><p class="eyebrow">PASSERELLE</p><h1 tabindex="-1">${c.contactSuccess}</h1><p>${c.contactSuccessText}</p><div class="contact-recap"><strong>${e(state.contact.name)}</strong><span>${e(state.contact.email)}</span><span>${e(state.contact.company)}</span></div>${btn(c.contactDownload,'download-contact','primary','download')}${btn(c.contactBack,'results','ghost','left')}<p class="small muted">${c.contactPrivacy}</p></div></main>`;return `<main id="main" class="contact-page section-width"><button class="text-button" data-action="results">${icon('left')}${c.contactBack}</button><div class="contact-layout"><section class="form-card"><p class="eyebrow">${c.nextCardTitle}</p><h1 tabindex="-1">${c.contactTitle}</h1><p class="form-intro">${c.contactText}</p>${brokerPanel()}<p class="required-note">${c.requiredContact}</p><form id="contact-form" novalidate>${Object.keys(state.contactErrors).length?`<div class="error-summary" role="alert">${c.validationTitle}</div>`:''}<div class="form-grid">${contactField('name',{required:true})}${contactField('email',{required:true,type:'email'})}${contactField('company')}${contactField('language')}${contactField('note')}<div class="consent-field full"><label><input type="checkbox" data-contact="consent" ${state.contact.consent?'checked':''} aria-required="true" ${state.contactErrors.consent?'aria-invalid="true" aria-describedby="consent-error"':''}><span>${c.contactConsent}</span></label>${state.contactErrors.consent?`<p id="consent-error" class="field-error">${c.errors.consent}</p>`:''}</div></div><div class="form-actions"><button type="submit" class="btn primary">${c.contactSubmit}${icon('arrow')}</button></div></form></section><aside class="help-card"><span class="help-icon">${icon('lock')}</span><h2>${c.privacy}</h2><p>${c.contactPrivacy}</p><div class="help-divider"></div><p>${c.handoffSub}</p></aside></div></main>`;}
function dialog(){const c=t();let body='';if(state.dialog==='reset')body=`<h2 id="dialog-title">${c.reset}</h2><p>${c.resetQuestion}</p><div class="dialog-actions">${btn(c.cancel,'close','secondary',null)}${btn(c.confirmReset,'confirm-reset','primary','trash')}</div>`;if(state.dialog==='privacy')body=`<h2 id="dialog-title">${c.privacyTitle}</h2><p>${c.privacyText}</p><p>${c.privacyContact}</p>`;if(state.dialog==='limits')body=`<h2 id="dialog-title">${c.limitsTitle}</h2><p>${c.limitsText}</p><p>${c.limitsRoute}</p><p>${c.limitsSamples}</p><h3>${c.sourcesTitle}</h3><p class="small">${c.contentReview} ${date(CONTENT_REVIEWED_AT,state.lang)} · ${RULE_VERSION}</p><ul class="source-list">${Object.values(SOURCES).map(s=>`<li><a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.title)} ${icon('external')}</a></li>`).join('')}</ul><p class="small">${c.sourceOriginal}</p><div class="report-boundary"><p>${c.boundary}</p></div>`;return `<dialog aria-labelledby="dialog-title" id="info-dialog"><button class="dialog-close" data-action="close" aria-label="${c.close}">${icon('close')}</button>${body}</dialog>`;}
function render(focus=false){document.documentElement.lang=state.lang;document.title=t().appTitle;document.querySelector('.skip-link').textContent=t().skip;app.innerHTML=header()+({landing,wizard,results,contact}[state.view]||landing)()+footer()+(state.dialog?dialog():'')+(state.toast?`<div class="toast" role="status">${icon('check')}${e(state.toast)}</div>`:'');if(state.dialog){const dialogEl=document.querySelector('dialog');dialogEl.showModal();dialogEl.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});}else if(focus)document.querySelector('h1')?.focus({preventScroll:true});}
function startSample(kind){state.data=sampleShipment(kind);state.statuses={};state.step=0;clearContact();nav('wizard');}
function updateField(target){const key=target.dataset.field;if(!key)return;if(state.data[key]!==target.value){state.contactReady=false;state.contact.consent=false;state.contactAt=null;}state.data[key]=target.value;state.statuses={};delete state.errors[key];}
function download(html,filename){try{const blob=new Blob([html],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(t().downloadReady);}catch{toast(t().downloadFailed);}}
function printReport(){const win=window.open('','_blank');if(!win){window.print();return;}win.document.write(shipmentReport(state.data,state.lang,state.statuses,state.calculatedAt));win.document.close();win.focus();setTimeout(()=>win.print(),200);}
app.addEventListener('input',event=>{const target=event.target;if(target.id==='tariff-code')tariffCode=target.value;if(target.dataset.field)updateField(target);if(target.dataset.contact){state.contact[target.dataset.contact]=target.type==='checkbox'?target.checked:target.value;state.contactReady=false;}});
app.addEventListener('change',event=>{const target=event.target;if(target.dataset.field){updateField(target);if(target.tagName==='SELECT'){const id=target.id;render(false);document.getElementById(id)?.focus({preventScroll:true});}}if(target.dataset.status){state.statuses[target.dataset.status]=target.value;const id=target.id;render(false);document.getElementById(id)?.focus({preventScroll:true});}});
app.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='shipment-form'){state.errors=validateStep(state.data,state.step);if(state.data.plannedDate&&state.step===2&&!/^\d{4}-\d{2}-\d{2}$/.test(state.data.plannedDate))state.errors.plannedDate='date';if(Object.keys(state.errors).length){render(false);document.querySelector('[aria-invalid="true"]')?.focus();return;}if(state.step<3){state.step++;nav('wizard');}else{const allErrors=[0,1,2,3].map(i=>validateStep(state.data,i));const invalid=allErrors.findIndex(err=>Object.keys(err).length);if(invalid>=0){state.step=invalid;state.errors=allErrors[invalid];render(true);return;}state.calculatedAt=new Date().toISOString();nav('results');}}else if(event.target.id==='contact-form'){const c=state.contact,errors={};if(!c.name.trim())errors.name='required';if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim()))errors.email='email';if(!c.consent)errors.consent='consent';state.contactErrors=errors;if(Object.keys(errors).length){render(false);document.querySelector('[aria-invalid="true"]')?.focus();return;}state.contactReady=true;state.contactAt=new Date().toISOString();nav('contact');}});
app.addEventListener('click',event=>{const language=event.target.closest('[data-lang]');if(language){state.lang=language.dataset.lang;render(false);document.querySelector(`[data-lang="${state.lang}"]`)?.focus({preventScroll:true});return;}const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){
 case 'tariff-lookup':lookupTariff();break;
 case 'home':nav('landing');break;
 case 'start':state.step=0;nav('wizard');break;
 case 'sample':startSample('standard');break;
 case 'sample-regulated':startSample('regulated');break;
 case 'back':state.step=Math.max(0,state.step-1);nav('wizard');break;
 case 'edit':state.step=0;nav('wizard');break;
 case 'edit-assumptions':state.step=3;nav('wizard');break;
 case 'results':nav('results');break;
 case 'how':nav('landing');document.getElementById('how')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});break;
 case 'trust':nav('landing');document.getElementById('trust')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});break;
 case 'privacy':case 'limits':case 'reset':dialogReturnAction=action;state.dialog=action;render(false);break;
 case 'close':closeDialog();break;
 case 'confirm-reset':{let failed=false;try{localStorage.removeItem(DRAFT_KEY);}catch{failed=true;}state.data=emptyShipment();if(!failed)state.savedDraft=null;state.statuses={};clearContact();state.calculatedAt=null;state.step=0;nav('landing');toast(failed?t().resetFailed:t().deleted);break;}
 case 'save':try{localStorage.setItem(DRAFT_KEY,JSON.stringify({version:1,shipment:state.data}));state.savedDraft={...state.data};toast(t().saved);}catch{toast(t().saveFail);}break;
 case 'resume':if(state.savedDraft){state.data=cleanShipment(state.savedDraft);state.statuses={};state.step=0;clearContact();nav('wizard');}break;
 case 'download':download(shipmentReport(state.data,state.lang,state.statuses,state.calculatedAt),'passerelle-report-'+state.lang+'.html');break;
 case 'print':printReport();break;
 case 'contact':state.contact.company=state.contact.company||state.data.company;state.contact.language=state.lang;nav('contact');break;
 case 'download-contact':download(contactReport(state.contact,state.data,state.lang,state.contactAt),'passerelle-contact-'+state.lang+'.html');break;
}});
render();

return {};
})();</script>
</head>
